<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Git &amp; GitHub Study Jam – Công bố các nhóm (ảnh bài đăng)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  CÁCH DÙNG
  - NỘI DUNG nằm ở file 2026-11-21-study-jam-teams.data.js (cùng thư mục). Muốn đổi chữ / thêm bớt nhóm,
    mentor: chỉ sửa file đó. File HTML này chỉ chứa giao diện, không cần đụng tới.
  - Mỗi .slide là một ảnh 1080x1350 (tỉ lệ 4:5, chuẩn bài đăng Facebook).
  - Chụp: mở file bằng Chrome → F12 → chọn một .slide → Ctrl+Shift+P → "Capture node screenshot".
  - Lưu thành img-1.webp, img-2.webp, ... vào thư mục bài news rồi cập nhật index.md.
  - Mở với ?s=2 để chỉ hiện đúng ảnh số 2 (dùng khi chụp tự động bằng Chrome headless).
  - Màu sắc nằm ở :root trong <style>.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1c44;
    --navy-2: #14275c;
    --orange: #f0622d;
    --ink: #ffffff;
    --muted: #b9c3e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2a2f3d; font-family: "Be Vietnam Pro", system-ui, sans-serif; color: var(--ink); padding: 40px 0; }
  .label { text-align: center; color: #9aa3bd; font: 500 16px/1 system-ui; margin: 28px 0 12px; }

  .slide {
    width: 1080px; height: 1350px; margin: 0 auto; position: relative; overflow: hidden;
    background: radial-gradient(1100px 700px at 100% 0%, var(--navy-2), var(--navy));
    padding: 80px 64px; display: flex; flex-direction: column;
  }
  /* decorative ">_" prompt in the corner */
  .slide::after {
    content: ">_"; position: absolute; right: -30px; bottom: -120px; font: 800 520px/1 "Montserrat", sans-serif;
    color: rgba(240, 98, 45, .07); pointer-events: none;
  }
  .slide > * { flex-shrink: 0; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top img { height: 84px; }
  .tag { font: 700 24px/1 "Montserrat", sans-serif; letter-spacing: .12em; color: var(--orange); }
  .bar { width: 120px; height: 10px; background: var(--orange); border-radius: 5px; margin: 44px 0 36px; }
  h1 { font: 800 92px/1.08 "Montserrat", sans-serif; letter-spacing: -.01em; }
  h1 em, h2 em { font-style: normal; color: var(--orange); }
  h2 { font: 800 56px/1.15 "Montserrat", sans-serif; }
  .lead { font-size: 38px; line-height: 1.5; color: var(--muted); margin-top: 36px; }
  .lead b { color: var(--ink); }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font-size: 26px; color: var(--muted); position: relative; z-index: 1; }
  .footer b { color: var(--ink); }
  .hash { color: var(--orange); font-weight: 600; }

  /* cover stats */
  .stats { display: flex; gap: 28px; margin-top: 60px; }
  .stat { flex: 1; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 28px; padding: 36px 40px; }
  .stat .n { font: 800 150px/1 "Montserrat", sans-serif; color: var(--orange); }
  .stat .t { font-size: 34px; margin-top: 8px; color: var(--muted); }

  /* team cards */
  .teams { display: flex; flex-direction: column; gap: 36px; margin-top: 44px; position: relative; z-index: 1; }
  .team { background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 32px; padding: 40px 40px; }
  .team-head { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
  .num { flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--orange); font: 800 34px/64px "Montserrat", sans-serif; text-align: center; }
  .team-name { font: 800 42px/1.2 "Montserrat", sans-serif; }
  .leader { display: inline-block; background: var(--orange); color: #fff; font: 700 28px/1 "Be Vietnam Pro", sans-serif; padding: 12px 22px; border-radius: 999px; margin-bottom: 20px; }
  .leader small { font-size: inherit; font-weight: 500; opacity: .85; margin-right: 6px; }
  .members { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; font-size: 30px; }
  .members li { white-space: nowrap; padding-left: 32px; position: relative; }
  .members li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); }

  .thanks { margin-top: 36px; font-size: 36px; line-height: 1.5; color: var(--muted); position: relative; z-index: 1; }
  .thanks b { color: var(--ink); }

  /* program info slide */
  .info { display: flex; flex-direction: column; gap: 20px; margin-top: 36px; position: relative; z-index: 1; }
  .row { display: flex; gap: 20px; }
  .card { flex: 1; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 28px; padding: 26px 34px; }
  .card .k { font: 700 22px/1 "Montserrat", sans-serif; letter-spacing: .1em; color: var(--orange); margin-bottom: 12px; }
  .card .v { font: 800 40px/1.15 "Montserrat", sans-serif; }
  .card .s { font-size: 27px; line-height: 1.4; color: var(--muted); margin-top: 8px; }
  .card .s b { color: var(--ink); }
  .mentors { display: flex; flex-direction: column; gap: 20px; margin-top: 32px; position: relative; z-index: 1; }
  .mentor { display: flex; align-items: center; gap: 32px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 32px; padding: 26px 40px; }
  .avatar { flex: none; width: 100px; height: 100px; border-radius: 50%; background: var(--orange); font-size: 52px; line-height: 100px; text-align: center; }
  .mentor .name { font: 800 46px/1.2 "Montserrat", sans-serif; }
  .mentor .role { font-size: 28px; color: var(--orange); font-weight: 600; margin-top: 6px; letter-spacing: .04em; }
  .prizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; }
  .prize { background: rgba(240,98,45,.14); border: 2px solid rgba(240,98,45,.55); border-radius: 20px; padding: 18px 8px; text-align: center; }
  .prize .r { font-size: 24px; color: var(--muted); }
  .prize .m { font: 800 34px/1.2 "Montserrat", sans-serif; margin-top: 6px; }
  .prize .m small { font-size: 22px; font-weight: 700; color: var(--orange); }

  /* ảnh bìa ngang 16:9 cho thẻ preview trên website / chia sẻ link */
  .slide.wide { width: 1600px; height: 900px; padding: 64px 90px; }
  .slide.wide .bar { margin: 28px 0 24px; }
  .wide-body { display: flex; align-items: center; justify-content: space-between; flex: 1; position: relative; z-index: 1; }
  .wide-body h1 { font-size: 104px; }
  .wide-stats { display: flex; gap: 24px; }
  .wide-stats .stat { padding: 30px 44px; text-align: left; flex: none; }
  .wide-stats .stat .n { font-size: 130px; }
  .wide-stats .stat .t { font-size: 30px; }
</style>
</head>
<body>
<script src="2026-11-21-study-jam-teams.data.js"></script>
<script>
(function () {
  const D = window.STUDY_JAM;
  const E = D.event;

  // ---------- helpers ----------
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // escape, then turn **x** into <b>x</b>
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // "A B" -> A <em>B</em> (last words in orange): first array item plain, the rest orange
  const title2 = ([plain, accent]) => `${esc(plain)} <em>${esc(accent)}</em>`;

  const teams = D.teams.list;
  const vars = {
    teams: teams.length,
    students: teams.reduce((n, t) => n + 1 + t.members.length, 0),   // leader + members
  };
  const fill = s => s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

  // ---------- slide parts ----------
  const top = tag => `<div class="top"><img src="${esc(E.logo)}" alt="HCMUTE DSC"><span class="tag">${esc(tag)}</span></div><div class="bar"></div>`;
  const footerSimple = () => `<div class="footer"><span>${md(E.footer)}</span></div>`;
  const footerFull = hashtags => `<div class="footer"><span><b>${esc(E.org)}</b><br>${esc(E.fb)}</span><span class="hash">${esc(hashtags)}</span></div>`;

  // ---------- slide builders ----------
  const cover = () => ({
    label: 'Bìa',
    html: `${top(D.cover.tag)}
      <h1>${esc(D.cover.title[0])}<br><em>${esc(D.cover.title[1])}</em></h1>
      <p class="lead">${md(D.cover.lead)}</p>
      <div class="stats">
        <div class="stat"><div class="n">${vars.teams}</div><div class="t">${esc(D.cover.teamsLabel)}</div></div>
        <div class="stat"><div class="n">${vars.students}</div><div class="t">${esc(D.cover.studentsLabel)}</div></div>
      </div>
      <p class="thanks">${md(fill(D.cover.thanks))}</p>
      ${footerFull(D.cover.hashtags)}`,
  });

  const card = (c, extra = '') =>
    `<div class="card"><div class="k">${esc(c.label)}</div><div class="v">${esc(c.value)}</div>${c.note ? `<div class="s">${md(c.note)}</div>` : ''}${extra}</div>`;

  const info = n => ({
    label: 'Thông tin chương trình',
    numbered: true,
    html: `${top(`${E.tag} · ${n.i}/${n.total}`)}
      <h2>${title2(D.info.title)}</h2>
      <div class="info">
        <div class="row">${card(D.info.time)}${card(D.info.kickoff)}</div>
        ${card(D.info.format)}
        ${card(D.info.rewards, `<div class="prizes">${D.info.rewards.prizes.map(p =>
          `<div class="prize"><div class="r">${esc(p.rank)}</div><div class="m">${esc(p.amount)}${p.unit ? `<small>${esc(p.unit)}</small>` : ''}</div></div>`).join('')}</div>`)}
      </div>
      ${footerSimple()}`,
  });

  const teamSlide = (chunk, startIndex, isLast) => n => ({
    label: `Nhóm ${startIndex + 1}${chunk.length > 1 ? ' – ' + (startIndex + chunk.length) : ''}`,
    html: `${top(`${E.tag} · ${n.i}/${n.total}`)}
      <h2>${title2(D.teams.title)}</h2>
      <div class="teams">${chunk.map((t, k) => `
        <div class="team">
          <div class="team-head"><div class="num">${startIndex + k + 1}</div><div class="team-name">${esc(t.name)}</div></div>
          <div class="leader"><small>${esc(D.teams.leaderLabel)}</small> ${esc(t.leader)}</div>
          <ul class="members">${t.members.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
        </div>`).join('')}
      </div>
      ${isLast ? `<p class="thanks">${md(D.closing.note)}</p>${footerFull(D.closing.hashtags)}` : footerSimple()}`,
  });

  const mentors = n => ({
    label: 'Mentor',
    html: `${top(`${E.tag} · ${n.i}/${n.total}`)}
      <h2>${title2(D.mentors.title)}</h2>
      <p class="lead" style="margin-top:24px">${md(D.mentors.lead)}</p>
      <div class="mentors">${D.mentors.list.map(name => `
        <div class="mentor"><div class="avatar">${esc(D.mentors.icon)}</div><div><div class="name">${esc(name)}</div><div class="role">${esc(D.mentors.role)}</div></div></div>`).join('')}
      </div>
      ${footerSimple()}`,
  });

  // 16:9 banner used as the news card preview (saved as cover.webp, not part of the Facebook set)
  const banner = () => ({
    label: 'Ảnh bìa ngang 16:9 (preview thẻ website) → lưu thành cover.webp',
    wide: true,
    html: `${top(D.cover.tag)}
      <div class="wide-body">
        <h1>${esc(D.cover.title[0])}<br><em>${esc(D.cover.title[1])}</em></h1>
        <div class="wide-stats">
          <div class="stat"><div class="n">${vars.teams}</div><div class="t">${esc(D.cover.teamsLabel)}</div></div>
          <div class="stat"><div class="n">${vars.students}</div><div class="t">${esc(D.cover.studentsLabel)}</div></div>
        </div>
      </div>
      ${footerFull(D.cover.hashtags)}`,
  });

  // ---------- assemble ----------
  const builders = [cover(), mentors, info];
  for (let i = 0; i < teams.length; i += D.teams.perSlide) {
    builders.push(teamSlide(teams.slice(i, i + D.teams.perSlide), i, i + D.teams.perSlide >= teams.length));
  }

  // page numbers "i/total" count every slide except the cover
  const total = builders.length - 1;
  const slides = builders.map((b, idx) => typeof b === 'function' ? b({ i: idx, total }) : b);
  slides.push(banner());   // always last, so it never shifts the numbering above

  const only = new URLSearchParams(location.search).get('s');   // ?s=2 -> render only slide 2
  if (only) document.body.style.padding = '0';

  slides.forEach((s, idx) => {
    const n = idx + 1;
    if (only && String(n) !== only) return;
    if (!only) document.body.insertAdjacentHTML('beforeend', `<p class="label">Ảnh ${n} · ${esc(s.label)}</p>`);
    document.body.insertAdjacentHTML('beforeend', `<section class="slide${s.wide ? ' wide' : ''}" id="s${n}">${s.html}</section>`);
  });
})();
</script>
</body>
</html>
